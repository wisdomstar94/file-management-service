# 로컬 개발용 postgres 단독 실행. compose.yml 이 include 로 가져다 쓴다.
#   docker compose -f dockers/compose.postgres.yml up -d
name: fms

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${DB_USER:-fms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fms-local-password}
      POSTGRES_DB: ${DB_NAME:-fms}
    ports:
      - "15432:5432"
    volumes:
      - fms-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  fms-postgres:
