# 단독 컨테이너 실행용. postgres 는 compose.postgres.yml 에서 가져온다.
#   yarn docker:up:local · docker:up:development · docker:up:production (README 의 도커 절 참고)
#
# 컨테이너 환경변수는 루트 env 파일을 그대로 넘긴다. 파일은 FMS_ENV_FILE 로 고르며 필수다.
# compose.postgres.yml 의 ${DB_*} 는 --env-file 로 채우므로 --env-file 에도 같은 파일을 넘겨야 한다.
name: fms

include:
  - compose.postgres.yml

x-env-file: &env-file
  - ../${FMS_ENV_FILE:?FMS_ENV_FILE 에 env 파일 이름을 지정하세요. README 의 도커 절 참고}

# 아래 environment 는 컨테이너 안에서 값이 달라야 하는 것만 고정한다. 같은 이름이면 env 파일 값보다 우선한다.
x-api-env: &api-env
  DB_HOST: postgres
  DB_PORT: "5432"
  API_PORT: "4000"
  STORAGE_DIR: /data/storage
  # web 컨테이너가 넘긴 X-Forwarded-For 만 믿는다. 브라우저가 api 에 직접 보낸 헤더는 무시해야 해서
  # 사설 대역 전체가 아니라 web 컨테이너의 고정 IP 만 지정한다. (아래 web-api 네트워크 참고)
  API_TRUST_PROXY: 172.31.240.10, 172.31.240.11

x-web-env: &web-env
  # web 서버가 api 를 호출할 주소. 컨테이너끼리는 도커 서비스 이름으로 닿는다.
  API_INTERNAL_URL: http://api:4000

services:
  migrator:
    build: { context: .., dockerfile: dockers/Dockerfile, target: api }
    env_file: *env-file
    environment: *api-env
    command: ["sh", "/app/dockers/scripts/run-migrations.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: dockers/Dockerfile, target: api }
    env_file: *env-file
    environment: *api-env
    networks: [default, web-api]
    ports: ["4000:4000"]
    volumes:
      - fms-storage:/data/storage
    depends_on:
      migrator: { condition: service_completed_successfully }

  admin-web:
    build: { context: .., dockerfile: dockers/Dockerfile, target: admin-web }
    env_file: *env-file
    environment: *web-env
    networks:
      web-api: { ipv4_address: 172.31.240.10 }
    ports: ["3000:3000"]
    depends_on: [api]

  user-web:
    build: { context: .., dockerfile: dockers/Dockerfile, target: user-web }
    env_file: *env-file
    environment: *web-env
    networks:
      web-api: { ipv4_address: 172.31.240.11 }
    ports: ["3001:3001"]
    depends_on: [api]

networks:
  # web → api 호출 전용. API_TRUST_PROXY 가 가리키는 web 고정 IP 를 여기서 준다.
  # 자동 할당은 ip_range(.128~)에서만 하게 해 고정 IP 와 겹치지 않게 한다.
  # postgres 단독 실행(compose.postgres.yml)도 default 네트워크를 쓰므로 그쪽은 건드리지 않는다.
  web-api:
    ipam:
      config:
        - subnet: 172.31.240.0/24
          ip_range: 172.31.240.128/25

volumes:
  fms-storage:
